# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every third-party component that goes into a Chiefrim binary, with its
# license (an SPDX expression) and how tools/check_licenses.py verifies it.
# Policy: docs/LICENSING.md. Adding a dependency means adding it here first;
# the checker fails the build for anything unlisted or not allowed.

[project]
license = "GPL-3.0-or-later"
# sha256 of the GNU's own gpl-3.0.txt; LICENSE at the repo root must match it
license_sha256 = "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"

[policy]
# Code linked or compiled into Chiefrim's binaries must be under one of these
# (all GPL-3.0 compatible). An "A OR B" expression passes if either side
# does; the component's entry then names the license Chiefrim takes.
code = [
	"GPL-3.0-or-later", "GPL-3.0-only", "GPL-2.0-or-later",
	"LGPL-3.0-or-later", "LGPL-3.0-only", "LGPL-2.1-or-later",
	"MIT", "MIT-0", "X11", "ISC", "0BSD", "BSD-2-Clause", "BSD-3-Clause",
	"Apache-2.0", "Zlib", "libtiff", "BSL-1.0", "MPL-2.0",
	"CC0-1.0", "Unlicense",
]
# Allowed only for data (fonts, images) shipped or embedded alongside code.
data = ["OFL-1.1", "CC-BY-4.0", "CC-BY-SA-4.0", "CC0-1.0", "LicenseRef-PublicDomain"]
# Never, in any form that is distributed with Chiefrim.
forbidden = [
	"BSD-4-Clause", "GPL-2.0-only", "LGPL-2.0-only", "AGPL-3.0-only",
	"SSPL-1.0", "CC-BY-NC-4.0", "CC-BY-ND-4.0", "JSON", "proprietary",
]

# ---- SKSE plugin (skse/)

[skse.commonlib]
path = "skse/extern/CommonLibSSE-NG"
license = "GPL-3.0-or-later WITH LicenseRef-CommonLibSSE-Modding-Exception"
license_file = "COPYING.txt"
markers = ["GNU GENERAL PUBLIC LICENSE", "Version 3, 29 June 2007"]
readme_marker = "GPL-3.0-or-later"
exceptions_file = "EXCEPTIONS.md"

# One entry per FetchContent_Declare in skse/CMakeLists.txt.
[[skse.fetchcontent]]
name = "spdlog"
license = "MIT"
license_file = "LICENSE"
markers = ["MIT License", "Gabi Melman"]
notice = "Copyright (c) 2016 - present, Gabi Melman and spdlog contributors."
bundles = "fmt (MIT; Copyright (c) 2012 - present, Victor Zverovich and {fmt} contributors), include/spdlog/fmt/bundled"

[[skse.fetchcontent]]
name = "rapidcsv"
license = "BSD-3-Clause"
license_file = "LICENSE"
markers = ["BSD 3-Clause License", "Kristofer Berggren"]
notice = "Copyright (c) 2017, Kristofer Berggren"

[[skse.fetchcontent]]
name = "directxtk"
license = "MIT"
license_file = "LICENSE"
markers = ["MIT License", "Microsoft Corporation"]
notice = "Copyright (c) Microsoft Corporation. (SimpleMath only)"

# Linked from the platform, never shipped by Chiefrim: the GPL's system
# library exception (GPL-3.0 §1), and CommonLib's Modding Exception names
# Windows and SKSE.
[[skse.system]]
name = "MSVC runtime and Windows SDK (incl. DirectXMath)"
note = "fetched by xwin for building only; the plugin uses the copy in the user's Windows/Proton"

[[skse.system]]
name = "SKSE64 runtime"
note = "installed by the user"

