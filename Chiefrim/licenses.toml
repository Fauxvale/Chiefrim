# 4-clause BSD (advertising clause): GPL-incompatible. Its only user,
# port/linux/src/xiso.c, is replaced by halo/overrides (docs/LICENSING.md).
[[halo.third_party]]
dir = "extract-xiso"
license = "BSD-4-Clause"
excluded = true
replaced_by = "port/linux/src/xiso.c"
# No compiled file may still carry its notice:
banned_marker = "in@fishtank.com"

# Inside the decompilation's own source tree.
[[halo.in_source]]
