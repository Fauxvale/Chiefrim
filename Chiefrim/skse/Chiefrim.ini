; Chiefrim: Master Chief in Skyrim. Goes in Data/SKSE/Plugins next to Chiefrim.dll.

[Controls]
; Chief's actions follow Skyrim's own controls. Each one below names the Skyrim
; action ("user event", as Skyrim's ControlMap calls it) that drives it, so when
; you rebind that action in Skyrim's Controls menu, Chief's follows. Movement
; (Forward, Back, Strafe Left, Strafe Right, Move stick), Look (mouse, right
; stick) and Sneak (Chief crouches while you sneak) always follow Skyrim's.
; Several Skyrim actions: separate them with commas.
sJump=Jump
sFire=Left Attack/Block
sZoom=Right Attack/Block
sReload=Ready Weapon
sThrowGrenade=Shout
sMelee=Toggle POV
sAction=Activate
sSwitchWeapon=Zoom In,Zoom Out

; Chiefrim's own hotkeys, for Halo actions Skyrim has no action for. Keyboard
; keys as DirectInput scan codes (G = 0x22 = 34, V = 0x2F = 47); gamepad
; buttons as Skyrim's gamepad codes (0 = none). If a hotkey is also one of
; your Skyrim keys, Chiefrim says so in the corner and in Chiefrim.log.
iSwitchGrenadeKey=34
iSwitchGrenadeButton=0
iFlashlightKey=47
iFlashlightButton=0
; Not Halo's: press it when Chief is stuck, and Chiefrim notes where and saves
; the collision around him (build/collision-dumps) for a bug report. F8 = 0x42 = 66.
iMarkStuckKey=66
iMarkStuckButton=0
; Debug: give Chief the next of the host map's weapons (they're listed in Halo's
; log at start), so all of them can be tried. F7 = 0x41 = 65 (not F9: that's
; Skyrim's Quickload); 0: off.
iGiveWeaponKey=65
; Chiefrim off and on: off, your character is Skyrim's own again (controls,
; camera, health) and Halo stops; on, Halo starts and links. F10 = 0x44 = 68.
iToggleChiefrimKey=68
; Halo stuck or misbehaving: kill it and start it again. F11 = 0x57 = 87.
; (Both need Halo run by tools/launch_halo.sh, which also restarts it by itself
; when it crashes, and when it stops responding.)
iRestartHaloKey=87

; Console commands (open Skyrim's console with ~). Not settings: a list of what
; you can type. With nothing after it, chiefrim prints this list.
;   chiefrim restart             restart Halo (as iRestartHaloKey)
;   chiefrim on | off | toggle   Chiefrim on or off (as iToggleChiefrimKey)
;   chiefrim give <name>         give Chief a weapon by name, any case:
;                                chiefrim give sniper rifle
;   chiefrim give                the next weapon (as iGiveWeaponKey)
;   chiefrim weapons             list the names chiefrim give takes
;   chiefrim shapes [on | off]   show where Skyrim's people and creatures can be
;                                hit, as wireframes seen through walls: yellow, a
;                                person's head (headshots) red, cyan when made
;                                from the actor's size, white when it has none
; Halo answers in the console; with the console open the game is paused, so
; an answer may show only the next time you open it. The command takes the
; place of TestSeenData, a developer command players don't use (Chiefrim.log
; says which one if that was taken).

; Look: 1.0 feels like Halo's own mouse at Skyrim's default sensitivity; Skyrim's
; Look Sensitivity slider and Invert Y apply on top. Right stick: radians per
; second at full tilt.
fLookSensitivity=1.0
fStickLookSpeed=3.0

[Camera]
; 1: Skyrim's camera uses Chief's field of view, which narrows when he zooms, as in
; Halo. 0: keep your Skyrim FOV (no zoom).
bUseHaloFov=1
; Chief's unzoomed field of view, in degrees, measured as Skyrim's FOV setting is
; (horizontal, for a 4:3 view). Halo's own is 61.5; 0 keeps it.
fFieldOfView=85

[Chief]
; Chief's standing height, in Skyrim units. His collision, crouch and eye height
; scale with it, so he fits where Skyrim's people do. -1: the same as your
; character (race and scale). 0: Halo's own (about 150, 7 ft in armour).
fHeight=-1
; Chief's collision radius, in Skyrim units: how close he gets to walls and how
; narrow a gap he fits through. -1: the same as your character (about 18), but
; never under 28: thinner, Halo lets him slip through walls and floors. 0: Halo's
; own (about 43).
fRadius=-1

[Overlay]
; 1: Halo draws Chief's arms, weapon and HUD over Skyrim's picture. 0: Skyrim's
; picture alone (Halo still runs Chief).
bEnabled=1
; 1: Skyrim's HUD (prompts, subtitles, compass, notifications, widgets) and
; menus are drawn over Halo's layers. 0: Halo's over everything.
bUnderSkyrimMenus=1
; Halo draws each frame through the camera Skyrim is drawing with, and Skyrim
; turns Halo's latest picture of its world (shots, effects, bullet holes) to
; the camera of the moment, so they stay put when you turn. Skyrim can also
; wait up to this many milliseconds for Halo's picture of this very frame:
; more exact while walking, at a cost in frame rate. 0: never wait.
fWaitMs=0

[HUD]
; While Chief plays, Halo's HUD has the crosshair, shields and health, so
; Skyrim's crosshair and its health and magicka bars are hidden (0: shown).
; The stamina bar stays, as Skyrim's sprint spends it (1: hidden too). The
; compass, sneak eye, activate prompt and the rest stay.
bHideCrosshair=1
bHideBars=1
bHideStamina=0

[Handoff]
; While you sit, sleep, work at a crafting station, ride, swim, or a scene
; holds you, Skyrim has the player: its own controls, camera and HUD, and
; Chief's weapon and HUD are put away until you're back on your feet. 0: Chief
; keeps the player throughout.
bEnabled=1
; When you die (Chief in Halo, or Skyrim kills you), Skyrim has the player too:
; its death camera, then the reload, until the loaded game has faded in and you
; have control again. 0: Chief's view and HUD stay through it.
bDeath=1
; How long after the reload's loading screen Skyrim keeps the player, while
; the game fades in (longer if Skyrim's fader is still up), in seconds.
fDeathFadeInSeconds=2.0

[Lighting]
; Chief's arms and weapon, and Halo's objects, lit by Skyrim's light where you
; are (its sun or moon, its ambient light, torches and fires near you) instead
; of the Halo map's own. 0: Halo's.
bEnabled=1
; How bright, all of it (1: as Skyrim's numbers say).
fBrightness=1.0
; How much torches, fires and spells near you add.
fPointLights=1.0
; 1: the sun and moon cast shadows on them: in a building's or a cliff's shade
; Chief's arms and weapon, and Halo's objects there, get no sunlight. Skyrim's
; physics shapes cast them (trees' trunks, not their leaves). 0: none.
bShadows=1
; Shiny weapons (the MA5B) show mostly a reflection, which is of what's
; around them: no stronger than Skyrim's picture around you is bright (its
; key, metered as [Grade]'s weapon look does) times this, and tinted by its
; colour (a cabin's warm wood, the snow's blue). Daylight leaves it as it
; is; a dim interior keeps the MA5B from shining white. 0: no cap.
fReflectionMatch=2.5
; The least that cap goes, in the dark.
fReflectionMin=0.15

[Grade]
; Skyrim grades its picture by its weather and the cell (an image space:
; saturation, brightness, contrast and a tint: night's blue, a storm's grey,
; dusk's warmth) and fades it; Halo's draws over it are graded the same way:
; Chief's arms and weapon, and Halo's shots and objects in the world, not
; Halo's HUD. 0: Halo's colours as they are.
bEnabled=1
; How much of Skyrim's grade (0 to 1).
fStrength=1.0
; How much of Skyrim's contrast (0 to 1). It's made for Skyrim's picture
; before its tone map, and on Halo's finished colours it overdoes the
; weapon's darks and lights; the log's "grade:" lines show Skyrim's numbers.
fContrast=0.25
; 1: Skyrim's fog (the weather's, or an interior's) over Halo's shots and
; objects in the world, as over its own. 0: none.
bFog=1
; Chief's arms and weapon matched to Skyrim's picture, before the grade (the
; HUD isn't touched). Halo's are lit by Skyrim's light but miss its tone map
; and haze: near black and dull in bright snow, too bright in the dark. Each
; frame the plugin meters Skyrim's own picture (how bright it is, its
; brightest, the colour of its shadows) and tones the weapon to it, adapting
; over about half a second as an eye does. The log's "the weapon's look:"
; lines give the numbers every 15 s.
; 1: matched to the picture. 0: only the fixed numbers below.
bWeaponMatchScene=1
; How bright, over the match (1: as matched).
fWeaponBrightness=1.0
; How saturated (1: Halo's; 0: grey).
fWeaponSaturation=0.9
; Highlights roll off softly above this much of the picture's brightest, so
; no shine is brighter than the sky (1: none; lower: softer).
fWeaponHighlights=0.6
; How much of the picture's shadow colour the weapon's darks take (the blue
; haze of a snowy day; nothing at night). 0: Halo's black.
fWeaponShadowLift=0.35
; The weapon's exposure follows the picture's: this in the dark and indoors,
; up to this in daylight.
fWeaponExposureMin=0.5
fWeaponExposureMax=1.1
; How far the weapon's colour shifts towards the picture's mean colour, as
; eyes take a room's light for white (a cabin's warm, a snowy day's cool).
; 0: Halo's colours.
fWeaponSceneTint=0.35

[Flashlight]
; Chief's flashlight (iFlashlightKey) lights Skyrim's world: a light where the
; beam along your view lands, as wide as Halo's beam is there, Halo's colour,
; fading in and out as Halo's does. 0: it lights only Halo's things.
bEnabled=1
; How bright (1: Halo's colour as it is).
fBrightness=1.5
; How far it reaches, of Halo's (1280 units, ~18 m).
fReach=1.0

[Combat]
; Chief's hits on Skyrim's people: a weapon takes as many hits to kill someone
; of your level as it takes on a marine in Halo, whatever their health. A
; headshot from a weapon that can make one (the pistol, the sniper rifle) kills
; outright, whatever their level, as it kills a marine.
; fDamageMult multiplies all of Chief's damage.
fDamageMult=1.0
; Tougher at higher levels: someone at 4 times your level takes 2 times the hits
; with 0.5 (between half and 3 times as many hits in all). 0: levels don't matter.
fLevelExponent=0.5
; Skyrim's damage to you hurts Chief, shields first: this much Skyrim damage
; takes all of his shields and health. Restore-health potions and food heal his
; health on the same scale (a 50-point potion: a fifth of all of it, as much as
; 50 damage takes).
fIncomingReference=250
; Chief's hits go through Skyrim's own hit processing (pain sounds, assault
; crime, perks and the like) when it's found; 0: damage, stagger, flinch, blood
; and the hit event, done by Chiefrim itself.
bSkyrimHitProcessing=1
; Explosions (grenades, rockets) throw people away from their centre and set
; them alight. How hard: Skyrim's knock-down force, halved for the edge of a
; blast and up to half again for its middle (0: no throw).
fBlastForce=10
; How long they burn, in seconds (0: no fire), and the burn's damage in all, as
; a share of their health (scaled like Chief's hits; fire resistance helps).
fBurnSeconds=5
fBurnDamage=0.15
; Explosions also throw loose objects (clutter, baskets, weapons lying about) up
; and away: this fast at the blast's centre, in metres a second, fading to
; nothing at its edge (0: they stay put). Splashes smaller than fPropMinRadius
; (Skyrim units: a plasma bolt's) move nothing.
fPropLaunchSpeed=5
fPropMinRadius=64
; 1: Chief's bullets, plasma and grenades go through Skyrim's destructible
; objects (spider webs, barricades) and damage them as Skyrim's own attacks
; would, by fObjectDamage a shot and up to fBlastObjectDamage an explosion
; (at its centre). A web has 10. 0: they stop shots like walls, unharmed.
bShootThroughDestructibles=1
fObjectDamage=10
fBlastObjectDamage=50
; 1: Chief's shots and explosions hit Skyrim's scripted objects as Skyrim's own
; attacks do (their OnHit): hanging oil lamps fall, tripwires and rigged beams
; go off. 0: they don't notice.
bShotsHitObjects=1
; 1: as a flame's hit (Skyrim's torch), so oil pools and trapped gas catch
; fire from a shot or a grenade. 0: an ordinary hit, which doesn't light them.
bShotsIgnite=1

[Collision]
; How far Chief's shots and grenades can hit Skyrim's world: Halo builds its
; collision from the regions (1024 units, ~15 m, each) around Chief's, this many
; in each direction; shots hit at least this many regions away (2: 2048 units,
; ~30 m, usually more). 1 to 3; more means slower collision builds in Halo
; (seconds, in the background) and more memory.
iRadius=2

[Movement]
; 1: your character walks, jumps and collides as Skyrim's own does, and Halo's
; Chief follows it (aimed where you look). 0: Halo's physics moves Chief and your
; character follows him (the first design: Halo's movement feel, but it catches
; and bounces on Skyrim's meshes).
bSkyrimMoves=1

[Caches]
; Weapon caches: Halo weapons lying by the chests (and weapon racks) of some of
; Skyrim's bandit, Forsworn and military camps and its forts, and now and then
; by a dungeon's boss chest (Nordic and Dwemer ruins, caves). Chosen the first
; time you come by, kept in your save: they stay where they are, and one you
; took stays taken. 0: none.
bEnabled=1
; How many camps and forts have any (0 to 1).
fSiteChance=0.5
; In one that has: how many of its chests get one (0 to 1).
fChestChance=0.35
; A fort's cache is a medium weapon this often, else a light one; camps only
; have light ones.
fMediumChance=0.3
; A fort's boss chest (deep inside) has a heavy weapon this often. Heavy
; weapons are found nowhere else.
fHeavyChance=0.6
; A dungeon's boss chest has a heavy weapon this often (its other chests none):
; a Nordic or Dwemer ruin's, and any other's (caves, mines).
fRuinHeavyChance=0.2
fDungeonHeavyChance=0.15
; At most this many in one camp or fort (a fort keeps one for its boss chest).
iMaxPerSite=3
; Skyrim units: caches this near are laid down in Halo's world.
fSendRadius=2500
; The weapons, by name (the host map's: chiefrim weapons lists them).
sLightWeapons=pistol, plasma pistol, needler, assault rifle
sMediumWeapons=shotgun, plasma rifle
; (Halo doesn't let Chief carry the fuel rod or the flamethrower.)
sHeavyWeapons=sniper rifle, rocket launcher, shotgun, plasma rifle
; Ammunition is scarce: a cache's weapon comes loaded, with this share (0 to 1)
; of the spare rounds one lying in Halo has (energy weapons part spent).
fLightSpare=0.5
fMediumSpare=0.25
fHeavySpare=0

[Loadout]
; What Chief starts with when there's no kit of his to load: a new game, a save
; from before Chiefrim kept one, or the first Halo of a session. After that, his
; kit (weapons, ammo, grenades, shields and health) is kept in each save.
; Weapons, comma-separated, each with the ammo it has when found lying around:
; assault rifle, pistol, shotgun, sniper rifle, rocket launcher, plasma pistol,
; plasma rifle, needler (all in d20, the host map). Chief carries
; two at once; the first is in his hands. Empty: the host map's own start.
sWeapons=assault rifle, pistol
iFragGrenades=4
iPlasmaGrenades=0
