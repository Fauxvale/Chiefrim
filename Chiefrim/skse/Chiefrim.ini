; Chiefrim: Master Chief in Skyrim. Goes in Data/SKSE/Plugins next to Chiefrim.dll.

[Controls]
; Chief's actions follow Skyrim's own controls. Each one below names the Skyrim
; action ("user event", as Skyrim's ControlMap calls it) that drives it, so when
; you rebind that action in Skyrim's Controls menu, Chief's follows. Movement
; (Forward, Back, Strafe Left, Strafe Right, Move stick), Look (mouse, right
; stick) and Sneak (Chief crouches while you sneak) always follow Skyrim's.
; Several Skyrim actions: separate them with commas.
sJump=Jump
sFire=Left Attack/Block
sZoom=Right Attack/Block
sReload=Ready Weapon
sThrowGrenade=Shout
sMelee=Toggle POV
sAction=Activate
sSwitchWeapon=Zoom In,Zoom Out

; Chiefrim's own hotkeys, for Halo actions Skyrim has no action for. Keyboard
; keys as DirectInput scan codes (G = 0x22 = 34, V = 0x2F = 47); gamepad
; buttons as Skyrim's gamepad codes (0 = none). If a hotkey is also one of
; your Skyrim keys, Chiefrim says so in the corner and in Chiefrim.log.
iSwitchGrenadeKey=34
iSwitchGrenadeButton=0
iFlashlightKey=47
iFlashlightButton=0
; Not Halo's: press it when Chief is stuck, and Chiefrim notes where and saves
; the collision around him (build/collision-dumps) for a bug report. F8 = 0x42 = 66.
iMarkStuckKey=66
iMarkStuckButton=0
; Debug: give Chief the next of the host map's weapons (they're listed in Halo's
; log at start), so all of them can be tried. F7 = 0x41 = 65 (not F9: that's
; Skyrim's Quickload); 0: off.
iGiveWeaponKey=65
; Chiefrim off and on: off, your character is Skyrim's own again (controls,
; camera, health) and Halo stops; on, Halo starts and links. F10 = 0x44 = 68.
iToggleChiefrimKey=68
; Halo stuck or misbehaving: kill it and start it again. F11 = 0x57 = 87.
; (Both need Halo run by tools/launch_halo.sh, which also restarts it by itself
; when it crashes, and when it stops responding.)
iRestartHaloKey=87

; Look: 1.0 feels like Halo's own mouse at Skyrim's default sensitivity; Skyrim's
; Look Sensitivity slider and Invert Y apply on top. Right stick: radians per
; second at full tilt.
fLookSensitivity=1.0
fStickLookSpeed=3.0

[Camera]
; 1: Skyrim's camera uses Chief's field of view, which narrows when he zooms, as in
; Halo. 0: keep your Skyrim FOV (no zoom).
bUseHaloFov=1
; Chief's unzoomed field of view, in degrees, measured as Skyrim's FOV setting is
; (horizontal, for a 4:3 view). Halo's own is 61.5; 0 keeps it.
fFieldOfView=85

[Chief]
; Chief's standing height, in Skyrim units. His collision, crouch and eye height
; scale with it, so he fits where Skyrim's people do. -1: the same as your
; character (race and scale). 0: Halo's own (about 150, 7 ft in armour).
fHeight=-1
; Chief's collision radius, in Skyrim units: how close he gets to walls and how
; narrow a gap he fits through. -1: the same as your character (about 18), but
; never under 28: thinner, Halo lets him slip through walls and floors. 0: Halo's
; own (about 43).
fRadius=-1

[Overlay]
; 1: Halo draws Chief's arms, weapon and HUD over Skyrim's picture. 0: Skyrim's
; picture alone (Halo still runs Chief).
bEnabled=1
; Halo draws each frame through the camera Skyrim is drawing with, and Skyrim
; turns Halo's latest picture of its world (shots, effects, bullet holes) to
; the camera of the moment, so they stay put when you turn. Skyrim can also
; wait up to this many milliseconds for Halo's picture of this very frame:
; more exact while walking, at a cost in frame rate. 0: never wait.
fWaitMs=0

[Combat]
; Chief's hits on Skyrim's people: a weapon takes as many hits to kill someone
; of your level as it takes on a marine in Halo, whatever their health.
; fDamageMult multiplies all of Chief's damage.
fDamageMult=1.0
; Tougher at higher levels: someone at 4 times your level takes 2 times the hits
; with 0.5 (between half and 3 times as many hits in all). 0: levels don't matter.
fLevelExponent=0.5
; Skyrim's damage to you hurts Chief, shields first: this much Skyrim damage
; takes all of his shields and health.
fIncomingReference=250

[Collision]
; How far Chief's shots and grenades can hit Skyrim's world: Halo builds its
; collision from the regions (1024 units, ~15 m, each) around Chief's, this many
; in each direction; shots hit at least this many regions away (2: 2048 units,
; ~30 m, usually more). 1 to 3; more means slower collision builds in Halo
; (seconds, in the background) and more memory.
iRadius=2

[Movement]
; 1: your character walks, jumps and collides as Skyrim's own does, and Halo's
; Chief follows it (aimed where you look). 0: Halo's physics moves Chief and your
; character follows him (the first design: Halo's movement feel, but it catches
; and bounces on Skyrim's meshes).
bSkyrimMoves=1
