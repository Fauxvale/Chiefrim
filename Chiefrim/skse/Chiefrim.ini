; Chiefrim: Master Chief in Skyrim. Goes in Data/SKSE/Plugins next to Chiefrim.dll.

[Controls]
; Chief's actions follow Skyrim's own controls. Each one below names the Skyrim
; action ("user event", as Skyrim's ControlMap calls it) that drives it, so when
; you rebind that action in Skyrim's Controls menu, Chief's follows. Movement
; (Forward, Back, Strafe Left, Strafe Right, Move stick), Look (mouse, right
; stick) and Sneak (Chief crouches while you sneak) always follow Skyrim's.
; Several Skyrim actions: separate them with commas.
sJump=Jump
sFire=Left Attack/Block
sZoom=Right Attack/Block
sReload=Ready Weapon
sThrowGrenade=Shout
sMelee=Toggle POV
sAction=Activate
sSwitchWeapon=Zoom In,Zoom Out

; Chiefrim's own hotkeys, for Halo actions Skyrim has no action for. Keyboard
; keys as DirectInput scan codes (G = 0x22 = 34, V = 0x2F = 47); gamepad
; buttons as Skyrim's gamepad codes (0 = none). If a hotkey is also one of
; your Skyrim keys, Chiefrim says so in the corner and in Chiefrim.log.
iSwitchGrenadeKey=34
iSwitchGrenadeButton=0
iFlashlightKey=47
iFlashlightButton=0

; Look: 1.0 feels like Halo's own mouse at Skyrim's default sensitivity; Skyrim's
; Look Sensitivity slider and Invert Y apply on top. Right stick: radians per
; second at full tilt.
fLookSensitivity=1.0
fStickLookSpeed=3.0

[Camera]
; 1: Skyrim's camera uses Chief's field of view, which narrows when he zooms, as in
; Halo. 0: keep your Skyrim FOV (no zoom).
bUseHaloFov=1
; Chief's unzoomed field of view, in degrees, measured as Skyrim's FOV setting is
; (horizontal, for a 4:3 view). Halo's own is 61.5; 0 keeps it.
fFieldOfView=95

[Chief]
; Chief's standing height, in Skyrim units. His collision, crouch and eye height
; scale with it, so he fits where Skyrim's people do. -1: the same as your
; character (race and scale). 0: Halo's own (about 150, 7 ft in armour).
fHeight=-1
; Chief's collision radius, in Skyrim units: how close he gets to walls and how
; narrow a gap he fits through. -1: the same as your character. 0: Halo's own
; (about 43).
fRadius=-1
